<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mua các sản phẩm chăm sóc sắc đẹp tại Sí Cosmetic">
    <title>Sí Cosmetic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #3b8d99;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .product {
            background-color: white;
            margin: 10px;
            padding: 15px;
            width: 250px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .product img {
            width: 100%;
            height: auto;
        }
        footer {
            background-color: #3b8d99;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Chào mừng đến với Sí Cosmetic!</h1>
        <p>Chăm sóc sắc đẹp cho bạn, mỗi ngày</p>
    </header>

    <section class="products">
        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Sản phẩm 1">
            <h3>Sản phẩm 1</h3>
            <p>Giới thiệu sản phẩm 1.</p>
            <a href="https://shopee.vn/sicosmetic" target="_blank">Mua ngay</a>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Sản phẩm 2">
            <h3>Sản phẩm 2</h3>
            <p>Giới thiệu sản phẩm 2.</p>
            <a href="https://shopee.vn/sicosmetic" target="_blank">Mua ngay</a>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Sản phẩm 3">
            <h3>Sản phẩm 3</h3>
            <p>Giới thiệu sản phẩm 3.</p>
            <a href="https://shopee.vn/sicosmetic" target="_blank">Mua ngay</a>
        </div>
    </section>

    <footer>
        <p>© 2025 Sí Cosmetic. Tất cả quyền được bảo vệ.</p>
    </footer>
</body>
</html>
